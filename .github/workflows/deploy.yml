# Auto-deploy market-desk to the VPS over SSH when main is pushed.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_restart:
        description: "Restart even during quiet windows 09:00-12:30 / 13:00-15:30 CST (true/false)"
        required: false
        default: "false"

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          # Prefer ed25519 deploy key; command_timeout covers pip + restart.
          command_timeout: 10m
          envs: REPO_DIR,INSTALL_DIR,FORCE_RESTART
          script: |
            set -euo pipefail
            REPO_DIR="${REPO_DIR:-$HOME/github/market-desk}"
            INSTALL_DIR="${INSTALL_DIR:-/opt/market-desk}"
            FORCE_RESTART="${FORCE_RESTART:-0}"
            export REPO_DIR INSTALL_DIR FORCE_RESTART
            if [[ ! -d "$REPO_DIR/.git" ]]; then
              echo "Missing git clone at $REPO_DIR"
              echo "On the server first: git clone https://github.com/lurenXYN/market-desk.git \"$REPO_DIR\""
              exit 1
            fi
            cd "$REPO_DIR"
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x deploy/remote-update.sh deploy/run-deferred-deploy.sh || true
            SKIP_PULL=1 bash deploy/remote-update.sh
        env:
          # Optional overrides (set as repo Variables, not required).
          REPO_DIR: ${{ vars.DEPLOY_REPO_DIR }}
          INSTALL_DIR: ${{ vars.DEPLOY_INSTALL_DIR }}
          FORCE_RESTART: ${{ github.event.inputs.force_restart || 'false' }}
