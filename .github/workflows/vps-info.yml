# Collect VPS status through GitHub Actions (no laptop-side SSH needed).
# Manual only: diagnostic, never restarts the service.
name: VPS info

on:
  workflow_dispatch:
    inputs:
      tail_lines:
        description: "日志尾部行数（默认 40）"
        required: false
        default: "40"

concurrency:
  group: vps-info
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Collect over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          TAIL_LINES: ${{ github.event.inputs.tail_lines || '40' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "TAIL_LINES=$TAIL_LINES bash -s" > /tmp/raw.json <<'REMOTE'
          set -uo pipefail
          REPO_DIR="${REPO_DIR:-$HOME/github/market-desk}"
          INSTALL_DIR="${INSTALL_DIR:-/opt/market-desk}"
          TAIL_LINES="${TAIL_LINES:-40}"
          # Keep the body even on 503: the payload says why (stale_seconds / loop),
          # and -f used to discard it behind a bare "curl failed".
          hcode=$(curl -sS --max-time 5 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8765/api/health 2>/dev/null || echo 000)
          echo "HEALTH_HTTP=$hcode" >&2
          head -c 400 /tmp/health.json >&2 || true; echo >&2
          health=$(cat /tmp/health.json 2>/dev/null || echo '{"ok":false,"detail":"curl failed"}')
          [ -n "$health" ] || health='{"ok":false,"detail":"empty body"}'
          # Probe the prior-session minute feed used for volume normalisation.
          tcode=$(curl -sS -m 8 -o /tmp/txdays.json -w '%{http_code}' "https://web.ifzq.gtimg.cn/appstock/app/day/query?code=sh000001" 2>/dev/null || echo 000)
          echo "TENCENT_DAYS_HTTP=$tcode" >&2
          head -c 240 /tmp/txdays.json >&2 || true; echo >&2
          ncode=$(curl -sS -m 8 -o /tmp/txdays2.json -w '%{http_code}' "https://web.ifzq.gtimg.cn/appstock/app/day/query?code=sz399001" 2>/dev/null || echo 000)
          echo "TENCENT_DAYS_SZ_HTTP=$ncode" >&2
          PYV=/opt/market-desk/.venv/bin/python
          [ -x "$PYV" ] || PYV=python3
          "$PYV" - <<'PY' >&2 2>&1 || true
          import asyncio, json, sqlite3, sys
          sys.path.insert(0, "/opt/market-desk")
          print("VOLUME_PACE_MODULE", end=" ")
          try:
              import market_desk.volume_pace as vp
              import market_desk.volume_baseline as vb
              from datetime import datetime
              print("present")
              async def main():
                  import httpx
                  async with httpx.AsyncClient(timeout=10.0) as c:
                      curve = await vb.prior_session_curve(c, "2026-11-18")
                      print("CURVE_POINTS", len(curve or []), "LAST", (curve or [{}])[-1].get("cum"), file=sys.stderr)
                      progress, basis = vp.pick_progress(prev_curve=curve, now=datetime.now())
                      print("PROGRESS", progress, basis, file=sys.stderr)
              asyncio.run(main())
          except Exception as exc:
              print("error", type(exc).__name__, exc)
          try:
              conn = sqlite3.connect("file:/opt/market-desk/data/desk.db?mode=ro", uri=True)
              row = conn.execute("SELECT trade_date, updated_at, payload FROM daily_snapshot ORDER BY trade_date DESC LIMIT 1").fetchone()
              body = json.loads(row[2])
              print("SNAP", row[0], row[1], "amount_yi=", body.get("amount_yi"), "pctile=", body.get("amount_pctile"), file=sys.stderr)
          except Exception as exc:
              print("sqlite error", type(exc).__name__, exc, file=sys.stderr)
          PY
          svc=$(systemctl is-active market-desk 2>/dev/null || echo unknown)
          up=$(uptime -p 2>/dev/null || uptime)
          mem=$(free -m | awk '/^Mem:/ {print $2" "$3" "$7}')
          disk=$(df -h / | awk 'NR==2 {print $2" "$3" "$5}')
          load=$(awk '{print $1" "$2" "$3}' /proc/loadavg)
          data=$(du -sh "$INSTALL_DIR/data" 2>/dev/null | awk '{print $1}')
          db=$(stat -c %s "$INSTALL_DIR/data/desk.db" 2>/dev/null || echo '')
          sha=$(git -C "$REPO_DIR" rev-parse --short HEAD 2>/dev/null || echo n/a)
          errors=$(journalctl -u market-desk --no-pager -n "$TAIL_LINES" 2>/dev/null | grep -Ei "error|traceback|blocked" | tail -n 15 | tr '\n' '|' || true)
          cat <<JSON
          {"ok": true, "service": "$svc", "uptime": "$up", "loadavg_1_5_15": "$load",
           "mem_mb_total_used_available": "$mem", "disk_root_size_used_pct": "$disk",
           "data_dir_size": "$data", "desk_db_bytes": "$db", "repo_head": "$sha",
           "health": $health,
           "recent_errors": "$errors"}
          JSON
          REMOTE

      - name: Shape artifact
        run: |
          python - "${{ github.event_name }}" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          raw = open("/tmp/raw.json", encoding="utf-8").read().strip()
          start = raw.find("{")
          payload = json.loads(raw[start:]) if start >= 0 else {"ok": False, "detail": raw[:300]}
          payload["collected_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          payload["errors"] = [x for x in str(payload.get("recent_errors") or "").split("|") if x.strip()][:15]
          payload.pop("recent_errors", None)
          with open("vps-info.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          print(json.dumps(payload, ensure_ascii=False)[:1200])
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-info
          path: vps-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "### VPS info collected" >> "$GITHUB_STEP_SUMMARY"
          echo '本地拉取：`python scripts/vps_info.py --artifacts`（需要 actions:read 的 token）' >> "$GITHUB_STEP_SUMMARY"