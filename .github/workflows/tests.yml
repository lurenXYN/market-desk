name: tests

on:
  push:
    paths:
      - "market_desk/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "market_desk/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q --no-header
