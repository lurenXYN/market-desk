# Dump /api/ops/review-check JSON from VPS for the 10/28 checklist.
name: Review check dump

on:
  workflow_dispatch:
    inputs:
      cf:
        description: "Include counterfactual (true/false)"
        required: false
        default: "false"

concurrency:
  group: review-check-dump
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump review-check over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            CF="${{ github.event.inputs.cf || 'false' }}"
            cd /opt/market-desk
            .venv/bin/python - <<PY
            import json
            from market_desk.review_check import build_review_check_sync, merge_counterfactual

            base = build_review_check_sync()
            if "${CF}".lower() in ("1", "true", "yes"):
                import asyncio
                out = asyncio.run(merge_counterfactual(base, cf_days=20))
            else:
                out = base
            # Compact summary for Actions log
            print("ASOF", out.get("asof"))
            print("OOS_DAYS", out.get("edge_oos_days"), "OOS_N", out.get("edge_oos_n"))
            for it in out.get("items") or []:
                samp = it.get("sample") or {}
                print(
                    f"ITEM {it.get('id')}\tlevel={it.get('level')}\t"
                    f"enough={samp.get('enough_for_todo')}\t"
                    f"days={samp.get('days')}\tn={samp.get('n')}\t"
                    f"verdict={it.get('ui_verdict')}\thint={it.get('hint')}"
                )
            path = "/tmp/review-check.json"
            with open(path, "w", encoding="utf-8") as f:
                json.dump(out, f, ensure_ascii=False, indent=2, default=str)
            print("WROTE", path, "bytes", __import__("os").path.getsize(path))
            PY
            # Print key metrics snippets (truncate huge cf)
            .venv/bin/python - <<'PY'
            import json
            from pathlib import Path
            data = json.loads(Path("/tmp/review-check.json").read_text(encoding="utf-8"))
            for it in data.get("items") or []:
                m = it.get("metrics") or {}
                keys = list(m.keys())[:12]
                slim = {k: m[k] for k in keys}
                print("METRICS", it.get("id"), json.dumps(slim, ensure_ascii=False, default=str)[:800])
            PY
